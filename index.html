<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ChatUI · 本地大模型聊天</title>
<meta name="description" content="纯前端 OpenAI 兼容聊天客户端，支持 Ollama、DeepSeek、GPT 等主流模型，数据全部保存在本地浏览器。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%235b9dff'/><path d='M5.8 7.3A3.2 3.2 0 019 4.1h6a3.2 3.2 0 013.2 3.2v5.1a3.2 3.2 0 01-3.2 3.2h-4.3l-3.4 2.6c-.5.4-1.2 0-1.2-.6V7.3z' fill='white'/><path d='M12 6.9l.86 1.94 1.94.86-1.94.86L12 12.5l-.86-1.94-1.94-.86 1.94-.86L12 6.9z' fill='%235b9dff'/></svg>">
<link rel="stylesheet" href="assets/vendor/highlight-dark.css" id="hljsDark">
<link rel="stylesheet" href="assets/vendor/highlight-light.css" id="hljsLight" disabled>
<link rel="stylesheet" href="assets/vendor/katex.min.css">
<!-- Tailwind CSS v4 产物，由 npm run build 生成；源文件在 src/tailwind.css -->
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<!-- ============ 图标库（全部为描边/填充 SVG，界面中不使用 emoji） ============ -->

  <defs>

    <symbol id="i-terminal" viewBox="0 0 24 24"><rect x="3.2" y="4.6" width="17.6" height="14.8" rx="2.6" stroke="currentColor" stroke-width="1.7" fill="none"/><path d="M7.6 9.6l2.6 2.4-2.6 2.4M12.8 14.4h3.8" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-code" viewBox="0 0 24 24"><path d="M8.6 8.6L4.8 12l3.8 3.4M15.4 8.6L19.2 12l-3.8 3.4M13.4 5.8l-2.8 12.4" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>

    <symbol id="i-pen" viewBox="0 0 24 24"><path d="M15.7 4.6l3.7 3.7-9.1 9.1-4.4 1.1a.6.6 0 01-.73-.73l1.1-4.4 9.43-8.77z" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linejoin="round"/><path d="M13.7 6.6l3.7 3.7" stroke="currentColor" stroke-width="1.7" fill="none"/></symbol>
    <symbol id="i-brain" viewBox="0 0 24 24"><path d="M9.5 4A3.5 3.5 0 006 7.5 3 3 0 005 13a3 3 0 002 4.6A3 3 0 0012 20V6.5A2.5 2.5 0 009.5 4zM14.5 4A3.5 3.5 0 0118 7.5 3 3 0 0119 13a3 3 0 01-2 4.6A3 3 0 0112 20" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linejoin="round"/></symbol>
    <symbol id="i-database" viewBox="0 0 24 24"><ellipse cx="12" cy="6.2" rx="7.4" ry="2.9" stroke="currentColor" stroke-width="1.7" fill="none"/><path d="M4.6 6.2v11.6c0 1.6 3.3 2.9 7.4 2.9s7.4-1.3 7.4-2.9V6.2M4.6 12c0 1.6 3.3 2.9 7.4 2.9s7.4-1.3 7.4-2.9" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round"/></symbol>

    <symbol id="i-bot" viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="12" rx="3" stroke="currentColor" stroke-width="1.7" fill="none"/><circle cx="9" cy="13" r="1.4" fill="currentColor"/><circle cx="15" cy="13" r="1.4" fill="currentColor"/><path d="M12 7V4M8 19v1.5M16 19v1.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8.6" r="3.7" stroke="currentColor" stroke-width="1.7" fill="none"/><path d="M5.2 20c0-3.4 3.1-5.7 6.8-5.7s6.8 2.3 6.8 5.7" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round"/></symbol>
    <symbol id="i-sparkles" viewBox="0 0 24 24"><path d="M10.4 3.5l1.7 4.4 4.4 1.7-4.4 1.7-1.7 4.4-1.7-4.4L4.3 9.6l4.4-1.7 1.7-4.4z" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/><path d="M17.6 14.4l.9 2.2 2.2.9-2.2.9-.9 2.2-.9-2.2-2.2-.9 2.2-.9.9-2.2z" fill="currentColor"/></symbol>

    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4.4l8.5 14.2H3.5L12 4.4z" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linejoin="round"/><path d="M12 10v4.1M12 16.9h.01" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.7" fill="none"/><path d="M12 11v5.4M12 7.9h.01" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></symbol>

    <symbol id="i-plug" viewBox="0 0 24 24"><path d="M9 3v6M15 3v6M7 9h10v3a5 5 0 01-10 0V9zM12 17v4" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>

    <!-- 主题 -->
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.7" fill="none"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linejoin="round"/></symbol>

    <!-- 标记 -->

    <symbol id="i-pin-fill" viewBox="0 0 24 24"><path d="M9.3 2.7h5.4a.9.9 0 01.88 1.1l-.82 4.1 3.3 3.3a.9.9 0 01-.64 1.53H6.58a.9.9 0 01-.64-1.53l3.3-3.3-.82-4.1a.9.9 0 01.88-1.1z" fill="currentColor"/><path d="M12 12.9v8.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>

<div class="app flex h-dvh overflow-hidden" id="app">

  <!-- ============ 侧边栏 ============ -->
  <aside class="sidebar flex w-(--sidebar-w) flex-none flex-col border-r border-line-soft bg-side transition-[margin-left] duration-[250ms] ease-soft" id="sidebar">
    <div class="flex items-center gap-2 px-3 pt-3 pb-1.5">
      <div class="flex min-w-0 flex-1 items-center gap-2.5">
        <span class="brand-tile"><svg class="ic"><use href="#i-logo"/></svg></span>
        <div class="min-w-0">
          <div class="brand-name">ChatUI</div>
          <div class="brand-sub">本地存储 · 任意模型</div>
        </div>
      </div>
      <button class="icon-btn" id="btnCloseSidebar" title="收起侧边栏"><svg class="ic"><use href="#i-close"/></svg></button>
    </div>

    <button class="mx-3 mt-2.5 mb-1.5 flex items-center gap-2 rounded-md border border-line bg-elev px-3 py-2.5 font-[550] transition-colors duration-150 hover:border-mute hover:bg-hover" id="btnNewChat">
      <svg class="ic"><use href="#i-plus"/></svg><span>开启新对话</span>
    </button>

    <div class="sb-search relative mx-3 mt-1.5 mb-2">
      <svg class="ic"><use href="#i-search"/></svg>
      <input type="text" id="convSearch" placeholder="搜索对话…" autocomplete="off"
             class="w-full rounded-[10px] border border-transparent bg-hover py-2 pr-2.5 pl-[30px] outline-none focus:border-accent focus:bg-elev">
    </div>

    <div class="flex-1 overflow-y-auto px-2 pb-2" id="convList"></div>

    <div class="flex gap-1 border-t border-line-soft p-2">
      <button class="sb-foot-btn relative flex flex-1 flex-col items-center gap-[3px] rounded-[10px] px-0.5 py-[7px] text-[11px] text-dim hover:bg-hover hover:text-txt" data-modal="assistants"><svg class="ic"><use href="#i-sparkles"/></svg><span>助手</span></button>
      <button class="sb-foot-btn relative flex flex-1 flex-col items-center gap-[3px] rounded-[10px] px-0.5 py-[7px] text-[11px] text-dim hover:bg-hover hover:text-txt" data-modal="memory"><svg class="ic"><use href="#i-brain"/></svg><span>记忆</span><em class="dot" id="memDot"></em></button>
      <button class="sb-foot-btn relative flex flex-1 flex-col items-center gap-[3px] rounded-[10px] px-0.5 py-[7px] text-[11px] text-dim hover:bg-hover hover:text-txt" data-modal="settings"><svg class="ic"><use href="#i-settings"/></svg><span>设置</span></button>
      <button class="sb-foot-btn relative flex flex-1 flex-col items-center gap-[3px] rounded-[10px] px-0.5 py-[7px] text-[11px] text-dim hover:bg-hover hover:text-txt" id="btnTheme" title="切换主题"><svg class="ic"><use href="#i-moon"/></svg><span>主题</span></button>
    </div>
  </aside>

  <div class="sb-backdrop" id="sbBackdrop"></div>

  <!-- ============ 主区域 ============ -->
  <main class="main relative flex min-w-0 flex-1 flex-col bg-canvas">
    <header class="topbar z-[5] flex h-[54px] flex-none items-center gap-2.5 border-b border-line-soft bg-canvas px-3">
      <button class="icon-btn only-mobile" id="btnOpenSidebar"><svg class="ic"><use href="#i-menu"/></svg></button>

      <div class="model-select flex items-center gap-1">
        <select id="selProvider" title="服务商"></select>
        <select id="selModel" title="模型"></select>
        <button class="icon-btn sm" id="btnRefreshModels" title="刷新模型列表"><svg class="ic"><use href="#i-refresh"/></svg></button>
      </div>

      <div class="chat-title min-w-0 flex-1 cursor-pointer truncate rounded-sm px-2 py-1 text-center text-[14px] font-[550] hover:bg-hover" id="chatTitle" title="点击重命名">新对话</div>

      <div class="top-actions flex items-center gap-1">
        <span class="badge" id="ctxBadge" title="当前对话上下文占用估算">0 tok</span>
        <button class="icon-btn" id="btnParams" title="模型参数"><svg class="ic"><use href="#i-sliders"/></svg></button>
        <button class="icon-btn" id="btnImport" title="导入对话 / 备份 / 记忆"><svg class="ic"><use href="#i-inbox"/></svg></button>
        <button class="icon-btn" id="btnExport" title="导出 / 导入"><svg class="ic"><use href="#i-download"/></svg></button>
      </div>
    </header>

    <div class="messages flex-1 overflow-x-hidden overflow-y-auto px-4 pt-5 pb-2" id="messages"></div>

    <div class="scroll-bottom" id="btnScrollBottom" title="回到底部"><svg class="ic"><use href="#i-arrow-down"/></svg></div>

    <div class="composer-wrap flex-none bg-linear-to-b from-transparent from-0% to-canvas to-[22%] px-4 pt-1.5 pb-2.5">
      <div class="attach-bar mx-auto mb-1.5 flex max-w-(--maxw) flex-wrap gap-2" id="attachBar"></div>
      <div class="composer mx-auto max-w-(--maxw) rounded-lg border border-line bg-field shadow-card transition-colors duration-150" id="composer">
        <div class="composer-inner flex items-end gap-1 px-2 pt-[7px] pb-[3px]">
          <button class="icon-btn" id="btnAttach" title="上传图片 / 文件"><svg class="ic"><use href="#i-image"/></svg></button>
          <textarea id="input" rows="1" placeholder="给模型发送消息…（Enter 发送，Shift+Enter 换行）"></textarea>
          <button class="icon-btn" id="btnMic" title="语音输入"><svg class="ic"><use href="#i-mic"/></svg></button>
          <button class="send-btn" id="btnSend" title="发送"><svg class="ic"><use href="#i-send"/></svg></button>
        </div>
        <div class="composer-foot flex items-center gap-2 px-3 pb-1.5 text-[11px] text-mute">
          <span id="composerHint">Enter 发送 · Shift+Enter 换行</span>
          <span class="flex-1"></span>
          <span id="tokenHint"></span>
        </div>
      </div>
      <div class="privacy-note mx-auto mt-1.5 flex max-w-(--maxw) items-center justify-center gap-1.5 text-center text-[11px] text-mute">
        <svg class="ic size-[13px]"><use href="#i-shield"/></svg>
        <span>数据仅保存在此浏览器本地（localStorage），刷新不丢失。</span>
      </div>
    </div>
  </main>
</div>
